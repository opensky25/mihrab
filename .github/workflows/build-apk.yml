name: Build & Release Android TV APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish on GitHub Releases (e.g. v1.0.0). Leave empty for v1.0.<run_number>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@^8.6.2 @capacitor/cli@^8.6.2 @capacitor/android@^8.6.2

      - name: Generate and configure Android TV project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/configure-android-tv.mjs
          npx cap sync android

      - name: Build and sign Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="../mihrab-tv-android-tv.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            rm -f release.keystore
          else
            keytool -genkeypair -v \
              -keystore temp-release.keystore \
              -alias mihrabtv \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Mihrab TV, O=Mihrab TV, C=US"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks temp-release.keystore \
              --ks-pass pass:android \
              --ks-key-alias mihrabtv \
              --key-pass pass:android \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            rm -f temp-release.keystore
          fi

          "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-tv-android-tv-apk
          path: mihrab-tv-android-tv.apk
          retention-days: 30

      - name: Determine release tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: release_meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "Mihrab TV ${{ steps.release_meta.outputs.tag }}"
          generate_release_notes: true
          files: mihrab-tv-android-tv.apk
